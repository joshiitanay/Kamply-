<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Kamply - College Attendance Manager</title>
  <meta name="description" content="Modern, mobile-friendly attendance tracking, skip calculator, and Ramjas College chemistry timetables.">
  <meta name="theme-color" content="#06080B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">

  <style>
    /* ==========================================================================
       1. KAMPLY LUXURY DESIGN SYSTEM - OBSIDIAN BLACK, CRIMSON RED & STARK WHITE
       ========================================================================== */
    :root {
      color-scheme: dark;
      --bg: #06080B;
      --surface: #0E1117;
      --surface-card: #131720;
      --surface-elevated: #1B212D;
      --surface-border: #232B3B;
      --surface-subtle: #161C26;

      --ink: #FFFFFF;
      --ink-secondary: #9BA8B8;
      --ink-muted: #627284;

      /* Electric Ruby / Crimson Red Brand Palette */
      --accent: #E11D48;
      --accent-bright: #F43F5E;
      --accent-glow: rgba(225, 29, 72, 0.4);
      --accent-soft: rgba(225, 29, 72, 0.14);
      --accent-text: #FB7185;
      --accent-border: rgba(225, 29, 72, 0.35);

      /* Functional Status Colors */
      --safe: #10B981;
      --safe-bg: rgba(16, 185, 129, 0.14);
      --safe-border: rgba(16, 185, 129, 0.35);

      --edge: #F59E0B;
      --edge-bg: rgba(245, 158, 11, 0.14);
      --edge-border: rgba(245, 158, 11, 0.35);

      --short: #EF4444;
      --short-bg: rgba(239, 68, 68, 0.14);
      --short-border: rgba(239, 68, 68, 0.35);

      --cancel: #8B98A5;
      --cancel-bg: rgba(139, 152, 165, 0.12);
      --cancel-border: rgba(139, 152, 165, 0.25);

      --gold: #FBBF24;
      --gold-bg: rgba(251, 191, 36, 0.15);
      --gold-border: rgba(251, 191, 36, 0.4);

      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --radius-pill: 9999px;

      --bottom-nav-h: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-main);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: var(--safe-top);
    }

    /* Screen-Edge Ambient Light Pulse (Option A Celebration) */
    .screen-edge-pulse {
      position: fixed;
      inset: 0;
      border: 3px solid transparent;
      pointer-events: none;
      z-index: 9998;
      border-radius: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .screen-edge-pulse.active-safe {
      border-color: #10B981;
      box-shadow: inset 0 0 45px rgba(16, 185, 129, 0.4), 0 0 35px rgba(16, 185, 129, 0.4);
      animation: pulseBorder 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .screen-edge-pulse.active-crimson {
      border-color: #E11D48;
      box-shadow: inset 0 0 45px rgba(225, 29, 72, 0.45), 0 0 35px rgba(225, 29, 72, 0.45);
      animation: pulseBorder 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseBorder {
      0% { opacity: 0; transform: scale(0.995); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Achievement Floating Banner */
    .achievement-banner {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 16px;
      right: 16px;
      margin: 0 auto;
      max-width: 440px;
      background: rgba(19, 23, 32, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--accent-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7), 0 0 25px var(--accent-glow);
      border-radius: var(--radius-pill);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      transform: translateY(-80px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .achievement-banner.show {
      transform: translateY(0);
      opacity: 1;
    }

    .achieve-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .achieve-text .title {
      font-size: 13px;
      font-weight: 800;
      color: #FFF;
      line-height: 1.2;
    }

    .achieve-text .sub {
      font-size: 11px;
      color: var(--accent-text);
      font-weight: 600;
    }

    /* ==========================================================================
       2. RADIANT STARTUP SPLASH SCREEN (2.5s CINEMATIC AURORA)
       ========================================================================== */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: #050709;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.55s;
    }

    .splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Radiant Red Ambient Light Aura */
    .splash-aurora {
      position: absolute;
      top: -30px;
      width: 170px;
      height: 170px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.65) 0%, rgba(225, 29, 72, 0.2) 45%, transparent 75%);
      filter: blur(28px);
      border-radius: 50%;
      animation: auroraPulse 2.4s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes auroraPulse {
      0% { transform: scale(0.9) rotate(0deg); opacity: 0.6; }
      50% { transform: scale(1.18) rotate(180deg); opacity: 0.95; }
      100% { transform: scale(1.0) rotate(360deg); opacity: 0.7; }
    }

    .splash-logo-wrap {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .splash-logo {
      width: 76px;
      height: 76px;
      background: linear-gradient(145deg, #181C26 0%, #0E121A 100%);
      border: 2px solid rgba(225, 29, 72, 0.65);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 38px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 35px var(--accent-glow);
      position: relative;
    }

    .splash-logo::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
      pointer-events: none;
    }

    .splash-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 20%, #B8C4D4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      animation: titleExpand 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 2;
    }

    @keyframes titleExpand {
      0% { opacity: 0; letter-spacing: -0.02em; transform: translateY(6px); }
      100% { opacity: 1; letter-spacing: 0.08em; transform: translateY(0); }
    }

    .splash-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-bright);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .splash-sub .pip {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pipBlink 1.2s infinite alternate;
    }

    @keyframes pipBlink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .splash-loader {
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-pill);
      margin-top: 26px;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .splash-loader-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(90deg, #E11D48, #FB7185);
      border-radius: var(--radius-pill);
      animation: loaderProgress 2.2s ease-in-out infinite;
    }

    @keyframes loaderProgress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* ==========================================================================
       3. APP SHELL & NAVIGATION (RED / BLACK THEME)
       ========================================================================== */
    .app-shell {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: 16px 16px calc(var(--bottom-nav-h) + var(--safe-bottom) + 24px);
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tab-content {
      animation: tabFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0 16px;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 18px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(145deg, #222938 0%, #111520 100%);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
      color: #FFF;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.04em;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #FFFFFF;
    }

    .brand-text .course-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-pill-quick {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-bright);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .profile-pill-quick:active {
      transform: scale(0.96);
    }

    .celebrate-btn-quick {
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.15s ease;
    }

    .celebrate-btn-quick:active {
      transform: scale(1.15) rotate(15deg);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(14, 17, 23, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--surface-border);
      z-index: 100;
      padding-bottom: var(--safe-bottom);
    }

    .nav-container {
      max-width: 580px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: var(--bottom-nav-h);
      padding: 0 8px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      padding: 4px;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      transition: transform 0.2s ease, stroke 0.2s ease;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .nav-item[aria-current="page"] {
      color: #FFFFFF;
    }

    .nav-item[aria-current="page"] svg {
      transform: translateY(-2px);
      stroke: var(--accent-bright);
      filter: drop-shadow(0 2px 8px var(--accent-glow));
    }

    .nav-item[aria-current="page"]::after {
      content: '';
      position: absolute;
      bottom: 6px;
      width: 16px;
      height: 3px;
      background: var(--accent);
      border-radius: var(--radius-pill);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Common Card Styling */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--ink-secondary);
      margin-bottom: 14px;
    }

    /* Status Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .pill.safe { background: var(--safe-bg); color: var(--safe); border: 1px solid var(--safe-border); }
    .pill.edge { background: var(--edge-bg); color: var(--edge); border: 1px solid var(--edge-border); }
    .pill.short { background: var(--short-bg); color: var(--short); border: 1px solid var(--short-border); }
    .pill.none { background: var(--surface-subtle); color: var(--ink-muted); border: 1px solid var(--surface-border); }
    .pill.admin { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); box-shadow: 0 0 8px rgba(251, 191, 36, 0.3); }

    /* Button Controls */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 18px;
      background: var(--surface-elevated);
      color: var(--ink);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn.primary {
      background: linear-gradient(180deg, #E11D48 0%, #BE123C 100%);
      border-color: #BE123C;
      color: #FFFFFF;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn.primary:hover:not(:disabled) {
      filter: brightness(1.1);
    }

    .btn.secondary {
      background: var(--surface-card);
      border-color: var(--surface-border);
    }

    .btn.warning {
      background: var(--edge-bg);
      border-color: var(--edge-border);
      color: #FBBF24;
    }

    .btn.danger {
      background: var(--short-bg);
      border-color: var(--short-border);
      color: #F87171;
    }

    .btn.danger.armed {
      background: #DC2626;
      border-color: #DC2626;
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
      animation: pulse 1s infinite alternate;
    }

    .btn.w-full {
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    /* Date Navigation Bar */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .date-info {
      flex: 1;
      text-align: center;
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      min-width: 0;
    }

    .date-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .date-sub {
      font-size: 12px;
      color: var(--ink-secondary);
      font-weight: 500;
    }

    .date-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      color: var(--ink);
      cursor: pointer;
      font-size: 18px;
      transition: background 0.15s ease;
    }

    .date-btn:hover {
      background: var(--surface-elevated);
    }

    .date-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="date"] {
      width: 100%;
      min-height: 42px;
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      color: var(--ink);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color-scheme: dark;
    }

    /* Class Cards */
    .class-card {
      background: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .class-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .class-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .class-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--ink-secondary);
      flex-wrap: wrap;
    }

    .time-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
    }

    .mark-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--surface);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--surface-border);
    }

    .mark-btn {
      min-height: 46px;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mark-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .mark-btn[aria-pressed="true"][data-st="P"] {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    .mark-btn[aria-pressed="true"][data-st="A"] {
      background: #EF4444;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
    }

    .mark-btn[aria-pressed="true"][data-st="C"] {
      background: #475569;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(71, 85, 105, 0.35);
    }

    .mark-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .today-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* Hero Overall Summary Card */
    .hero-summary {
      background: linear-gradient(135deg, #1C1118 0%, #11141B 100%);
      border: 1px solid #381E2B;

    /* ==========================================================================
       3. CONSTANTS & SYSTEM CONFIGURATION
       ========================================================================== */
    const STORAGE_KEY = 'kamply.v1';
    const ADMIN_PASSCODE = 'RAMJAS2026'; // Secret Admin Passkey for Tanay
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    const DEFAULT_SUBJECTS = [
      { id: 'org-t', name: 'Organic Theory' },

    const DEFAULT_PROFILE = {

      college: 'Ramjas College',
      course: 'B.Sc. (Hons) Chemistry',
      year: '2nd Year',
      sem: 'Semester 3',
      section: 'Section A'
    };

    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const parseKey = k => {
      const p = k.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);
    };
    const addDays = (k, n) => {
      const d = parseKey(k);
      d.setDate(d.getDate() + n);
      return keyOf(d);
    };
    const todayKey = () => keyOf(new Date());

    const fmtDate = k => parseKey(k).toLocaleDateString('en-IN', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });

    const fmtTime = t => {
      if (!t) return 'Time not set';
      const p = t.split(':').map(Number);
      return ((p[0] + 11) % 12 + 1) + ':' + pad(p[1]) + ' ' + (p[0] >= 12 ? 'PM' : 'AM');
    };

    const uid = () => Math.random().toString(36).slice(2, 9);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const isExtraKey = k => {
      const parts = k.split('|');
      return parts.length > 1 && parts[1].indexOf('extra-') === 0;
    };
    const bySlot = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');
    const clampThr = v => {
      v = Math.round(Number(v));
      return isFinite(v) ? Math.min(999, Math.max(10, v)) : 667;
    };

    /* ==========================================================================
       4. LUXURY CELEBRATION ENGINE (OPTION A: SCREEN EDGE AMBIENT PULSE)
       ========================================================================== */
    let achieveTimer = null;

    function triggerLuxuryPulse(kind, title, subtitle) {
      const pulseEl = document.getElementById('screen-edge-pulse');
      const bannerEl = document.getElementById('achievement-banner');

    /* ==========================================================================
       5. STATE MANAGEMENT & STORAGE ('kamply.v1')
       ========================================================================== */
    function baseState() {
      return {
        v: 1,
        threshold: 667,
        onboarded: false,
        isAdmin: false,
        profile: Object.assign({}, DEFAULT_PROFILE),
        subjects: DEFAULT_SUBJECTS.map(s => ({ id: s.id, name: s.name })),
        slots: [],
        records: {}
      };
    }

    function normalize(o, isRestore) {
      if (!o || typeof o !== 'object') throw new Error('Invalid state object');

      const rawSubjects = Array.isArray(o.subjects) ? o.subjects : DEFAULT_SUBJECTS;
      const subjects = rawSubjects
        .filter(s => s && typeof s.id === 'string' && typeof s.name === 'string')
        .map(s => ({ id: s.id, name: s.name.slice(0, 60) }));
      const ids = new Set(subjects.map(s => s.id));

      const rawSlots = Array.isArray(o.slots) ? o.slots : [];
      const slots = rawSlots
        .filter(x => x && typeof x.id === 'string' && ids.has(x.subjectId) && Number.isInteger(x.day) && x.day >= 1 && x.day <= 6)
        .map(x => ({
          id: x.id,
          day: x.day,
          subjectId: x.subjectId,
          time: /^\d{2}:\d{2}$/.test(x.time || '') ? x.time : ''
        }));

      const records = {};
      if (o.records && typeof o.records === 'object') {
        for (const k in o.records) {
          const r = o.records[k];
          if (r && /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') && ids.has(r.subjectId) &&
              ['P', 'A', 'C', null].indexOf(r.st) > -1 && /^\d{4}-\d{2}-\d{2}\|[\w-]+$/.test(k)) {
            records[k] = { date: r.date, subjectId: r.subjectId, st: r.st };
          }
        }
      }

      const profile = Object.assign({}, DEFAULT_PROFILE, (o.profile && typeof o.profile === 'object') ? o.profile : {});
      profile.college = 'Ramjas College';
      profile.course = 'B.Sc. (Hons) Chemistry';

      let onboarded = Boolean(o.onboarded);
      if (!onboarded && (Object.keys(records).length > 0 || slots.length > 0)) {
        onboarded = true;
      }

      return {
        v: 1,
        threshold: clampThr(o.threshold),
        onboarded: onboarded,
        isAdmin: Boolean(o.isAdmin),
        profile: profile,
        subjects: subjects.length ? subjects : DEFAULT_SUBJECTS.map(s => ({ id: s.id, name: s.name })),
        slots: slots,
        records: records
      };
    }

    let state;
    let storageOk = true;

    function loadState() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        storageOk = false;
        return baseState();
      }
      if (!raw) return baseState();
      try {
        return normalize(JSON.parse(raw), false);
      } catch (e) {
        return baseState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        storageOk = false;
      }
    }

    /* ==========================================================================
       6. ATTENDANCE STATISTICS & VERDICT ENGINE
       ========================================================================== */
    const thr = () => (state.threshold / 10).toFixed(1);

    function computeStats() {
      const m = {};
      state.subjects.forEach(s => {
        m[s.id] = { a: 0, t: 0, c: 0 };
      });

      for (const k in state.records) {
        const r = state.records[k];
        const o = m[r.subjectId];
        if (!o) continue;
        if (r.st === 'P') {
          o.a++;
          o.t++;
        } else if (r.st === 'A') {
          o.t++;
        } else if (r.st === 'C') {
          o.c++;
        }
      }
      return m;
    }

    const pctText = o => o.t ? (pct10(o.a, o.t) / 10).toFixed(1) + '%' : '–';

    function getVerdict(o) {
      const P = state.threshold;
      const plural = n => n > 1 ? 'es' : '';

      if (o.t === 0) {
        return {
          kind: 'none',
          label: 'No data',
          text: 'No classes recorded yet.',
          short: 'No classes yet'
        };
      }

      if (1000 * o.a >= P * o.t) {
        const x = canSkip(o.a, o.t, P);
        if (x > 0) {
          return {
            kind: 'safe',
            label: 'Safe',
            text: 'You can skip ' + x + ' more class' + plural(x) + ' and stay at or above ' + thr() + '%.',
            short: 'Can skip ' + x
          };
        }
        return {
          kind: 'edge',
          label: 'On the line',
          text: "Right on the line. Don't miss the next class.",
          short: 'On the line'
        };
      }

      const y = needAttend(o.a, o.t, P);
      return {
        kind: 'short',
        label: 'Short',
        text: 'Attend the next ' + y + ' class' + plural(y) + ' in a row to reach ' + thr() + '%.',
        short: 'Attend next ' + y
      };
    }

    const getSubjectName = id => {
      const s = state.subjects.find(x => x.id === id);
      return s ? s.name : 'Removed subject';
    };

    function arm(id, fn) {
      if (armedAction === id) {

        fn();

      armedAction = id;

    function commit() {
      saveState();
      render();
    }

    function getFocusSignature() {
      const el = document.activeElement;
      if (!el || !el.dataset || !el.dataset.act || !$app.contains(el)) return null;
      return Object.assign({}, el.dataset);
    }

    function restoreFocus(sig) {
      if (!sig) return;
      const els = $app.querySelectorAll('[data-act]');
      for (const el of els) {
        const d = el.dataset;
        const ks = Object.keys(sig);
        if (Object.keys(d).length === ks.length && ks.every(k => d[k] === sig[k])) {
          el.focus({ preventScroll: true });
          return;
        }
      }
    }

    function loadOfficialPreset(presetKey) {
      const preset = RAMJAS_PRESETS[presetKey];
      if (!preset) return false;

      state.profile.year = preset.year;

      state.profile.section = preset.section;
      state.subjects = preset.subjects.map(s => ({ id: s.id, name: s.name }));
      state.slots = preset.slots.map(sl => ({

        time: sl.time,
        subjectId: sl.subjectId
      }));

      commit();
      triggerLuxuryPulse('safe', 'Official Schedule Loaded', preset.title);
      return true;
    }

    /* --- VIEW 3: TIMETABLE --- */
    function renderTimetableView() {
      const chips = [1, 2, 3, 4, 5, 6].map(d => {
        const count = state.slots.filter(x => x.day === d).length;
        return `
          <button class="day-chip" data-act="pick-tt-day" data-d="${d}" aria-pressed="${ttDay === d}">
            <span>${DAYS[d].slice(0, 3)}</span>
            <span class="chip-count">${count}</span>
          </button>
        `;
      }).join('');

      const subjectOptions = sel => state.subjects.map(s => `
        <option value="${esc(s.id)}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>
      `).join('');

      const slotsForDay = state.slots.filter(x => x.day === ttDay).sort(bySlot);

      const slotsListHtml = slotsForDay.map(x => `
        <div class="card" style="padding:12px;margin-bottom:10px;">
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="time" value="${x.time}" data-act="update-slot-time" data-id="${x.id}" aria-label="Class Start Time" style="max-width:130px;">
            <select data-act="update-slot-sub" data-id="${x.id}" aria-label="Select Subject" style="flex:1;">
              ${subjectOptions(x.subjectId)}

            <button class="btn danger" style="min-height:42px;padding:0 12px;" data-act="del-slot" data-id="${x.id}" aria-label="Remove Class">
              ✕
            </button>
          </div>
        </div>
      `).join('');

      return `
        <div class="tab-content">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
            <div>
              <div class="card-title">Weekly Timetable</div>

            </div>
            <button class="btn secondary" style="min-height:36px;padding:0 12px;font-size:12px;" data-act="show-preset-modal">

            <div style="font-size:11px;color:var(--ink-secondary);margin-bottom:4px;font-weight:600;">Ramjas Period Presets:</div>
            <div class="period-chips">
              <span class="p-chip" data-act="apply-period" data-t="08:30">08:30 Period 1</span>
              <span class="p-chip" data-act="apply-period" data-t="09:30">09:30 Period 2</span>
              <span class="p-chip" data-act="apply-period" data-t="10:30">10:30 Period 3</span>
              <span class="p-chip" data-act="apply-period" data-t="11:30">11:30 Period 4</span>
              <span class="p-chip" data-act="apply-period" data-t="13:00">01:00 Period 5</span>
              <span class="p-chip" data-act="apply-period" data-t="14:00">02:00 Lab/Prac</span>
            </div>

          <div class="day-selector" role="group" aria-label="Days of week">

          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <h3 style="font-size:15px;font-weight:700;">${DAYS[ttDay]} Classes</h3>
            <span style="font-size:12px;color:var(--ink-secondary);">${slotsForDay.length} scheduled</span>

          ${slotsListHtml || `
            <div class="empty-state">
              <div class="empty-icon">📅</div>

            <button class="btn secondary" style="min-height:32px;padding:0 10px;font-size:12px;" data-act="close-admin-modal">✕</button>
          </div>
          <div style="font-size:13px;color:var(--ink-secondary);margin-bottom:12px;">
            Here are the official presets currently live in Kamply:
          </div>
          ${listHtml}
          <div style="margin-top:12px;">
            <button class="btn primary w-full" data-act="copy-admin-presets">📋 Export Master Presets JSON</button>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       10. MAIN RENDER DISPATCHER
       ========================================================================== */
    function render() {
      const qName = document.getElementById('quick-student-name');
      if (qName) {
        qName.textContent = state.profile && state.profile.name ? state.profile.name.split(' ')[0] : 'Profile';
      }

      document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => {
        const isCurrent = btn.dataset.v === activeTab;
        btn.setAttribute('aria-current', isCurrent ? 'page' : 'false');
      });

      if (!state.onboarded) {
        renderOnboardingModal();
        return;
      } else if (onboardingStep > 0) {
        renderOnboardingModal();
      } else {
        $onboarding.style.display = 'none';
        $onboarding.innerHTML = '';
      }

      const focusSig = getFocusSignature();
      const views = {
        today: renderTodayView,
        overview: renderOverviewView,
        timetable: renderTimetableView,
        profile: renderProfileView
      };

      const renderFn = views[activeTab] || renderTodayView;
      $app.innerHTML = renderFn();
      restoreFocus(focusSig);
    }

    /* ==========================================================================
       11. EVENT DELEGATION
       ========================================================================== */
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn || btn.disabled || btn.tagName === 'INPUT' || btn.tagName === 'SELECT' || btn.tagName === 'TEXTAREA') return;

      const act = btn.dataset.act;
      const d = btn.dataset;

      switch (act) {
        /* Luxury Ambient Light Trigger */
        case 'trigger-luxury-celebrate':
          triggerLuxuryPulse('safe', 'You are on Track! 🚀', 'Keep up the momentum in college.');
          break;

        /* ID Card Tap Counter for Secret Admin Unlock */
        case 'id-card-tap':
          clearTimeout(adminTapTimer);
          adminTapCount++;
          if (adminTapCount >= 5) {
            adminTapCount = 0;
            state.isAdmin = !state.isAdmin;
            commit();
            triggerLuxuryPulse('crimson', state.isAdmin ? '👑 Admin Mode Enabled' : '🔒 Admin Mode Disabled', 'Ramjas Chemistry Lead');
            toast(state.isAdmin ? '👑 Admin Mode Unlocked!' : 'Admin Mode Deactivated');
          } else {
            adminTapTimer = setTimeout(() => { adminTapCount = 0; }, 1200);
          }
          break;

        case 'prompt-admin-login': {
          const pass = prompt('Enter Ramjas Chemistry Admin Passcode:');
          if (pass === ADMIN_PASSCODE) {
            state.isAdmin = true;
            commit();
            triggerLuxuryPulse('crimson', '👑 Admin Access Granted', 'Welcome Tanay!');
            toast('👑 Admin Access Granted!');
          } else if (pass !== null) {
            toast('Incorrect passcode.');
          }
          break;
        }

        case 'admin-revoke':
          state.isAdmin = false;
          commit();
          toast('Admin Mode Deactivated.');
          break;

        case 'admin-view-all':
          renderAdminModal();
          break;

        case 'close-admin-modal':
          $adminModal.style.display = 'none';
          break;

        case 'copy-admin-presets': {
          const json = JSON.stringify(RAMJAS_PRESETS, null, 2);
          navigator.clipboard.writeText(json).then(() => {
            toast('Master Presets JSON copied to clipboard!');
          });
          break;
        }

        /* Navigation */
        case 'nav':
          activeTab = d.v;
          armedAction = null;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;

        /* Date Navigation */
        case 'day-step':
          viewDate = addDays(viewDate, +d.n);
          render();
          break;

        case 'go-today':
          viewDate = todayKey();
          render();
          break;

        /* Attendance Marking */
        case 'mark-status': {
          const cur = state.records[d.key];
          if (cur && cur.st === d.st) {
            if (isExtraKey(d.key)) cur.st = null;
            else delete state.records[d.key];
          } else {
            state.records[d.key] = { date: viewDate, subjectId: d.sub, st: d.st };
            if (d.st === 'P') {
              const st = computeStats();
              let a = 0, t = 0;
              state.subjects.forEach(s => { a += st[s.id].a; t += st[s.id].t; });
              if (t > 0 && 1000 * a >= state.threshold * t) {
                if (Math.random() < 0.2) triggerLuxuryPulse('safe', 'Attendance Goal Maintained! ✨', 'You are above target.');
              }
            }
          }
          commit();
          break;
        }

        case 'mark-all-present': {
          const dow = parseKey(viewDate).getDay();
          state.slots.filter(x => x.day === dow).forEach(x => {
            const k = viewDate + '|' + x.id;
            if (!state.records[k] || !state.records[k].st) {
              state.records[k] = { date: viewDate, subjectId: x.subjectId, st: 'P' };
            }
          });
          commit();
          triggerLuxuryPulse('safe', 'All Marked Present! ✨', 'All scheduled classes recorded.');
          toast('Marked remaining classes as Present!');
          break;
        }

        /* 1-Tap College Holiday / Fest Day */
        case 'mark-holiday': {
          const dow = parseKey(viewDate).getDay();
          state.slots.filter(x => x.day === dow).forEach(x => {
            const k = viewDate + '|' + x.id;
            state.records[k] = { date: viewDate, subjectId: x.subjectId, st: 'C' };
          });
          for (const k in state.records) {
            if (state.records[k].date === viewDate) {
              state.records[k].st = 'C';
            }
          }
          commit();
          triggerLuxuryPulse('safe', '🎉 College Holiday / Fest', 'Classes cancelled without penalty!');
          toast('🎉 College Holiday marked! No attendance penalty.');
          break;
        }

        /* Extra Classes */
        case 'add-extra': {
          const sel = document.getElementById('extra-sub-select');
          if (!sel || !sel.value) break;
          state.records[viewDate + '|extra-' + uid()] = { date: viewDate, subjectId: sel.value, st: null };
          commit();
          toast('Extra class added for today.');
          break;
        }

        case 'del-extra':
          delete state.records[d.key];
          commit();
          toast('Extra class removed.');
          break;

        /* Bunk Simulator */
        case 'sim-mode':
          simMode = d.m;
          render();
          break;

        case 'sim-step':
          simCount = Math.max(1, Math.min(20, simCount + (+d.delta)));
          render();
          break;

        /* Timetable Editing */
        case 'pick-tt-day':
          ttDay = +d.d;
          render();
          break;

        case 'apply-period':
          state.slots.push({ id: uid(), day: ttDay, subjectId: state.subjects[0].id, time: d.t });
          commit();
          toast('Added period at ' + fmtTime(d.t));
          break;

        case 'add-slot':
          if (!state.subjects.length) {
            toast('Add subjects in Profile first.');
            break;
          }
          state.slots.push({ id: uid(), day: ttDay, subjectId: state.subjects[0].id, time: '' });
          commit();
          break;

        case 'del-slot':
          state.slots = state.slots.filter(x => x.id !== d.id);
          commit();
          break;

        /* Presets Modal */
        case 'show-preset-modal':
          renderPresetModal();
          break;

        case 'close-preset-modal':
          $presetModal.style.display = 'none';
          break;

        case 'load-preset-key':
          if (loadOfficialPreset(d.k)) {
            $presetModal.style.display = 'none';
            toast('✨ Official Ramjas Timetable fetched!');
          }
          break;

        /* Share Modal */
        case 'show-share-modal':
          renderShareModal();
          break;

        case 'close-share-modal':
          $shareModal.style.display = 'none';
          break;

        case 'copy-share-code': {
          const area = document.getElementById('share-code-area');
          if (area) {
            area.focus();
            area.select();
            try {
              navigator.clipboard.writeText(area.value).then(() => {
                toast('Timetable code copied to clipboard!');
              });
            } catch (err) {
              toast('Code selected. Press Ctrl+C or Copy.');
            }
          }
          break;
        }

        case 'import-share-code': {
          const area = document.getElementById('import-share-area');
          const code = area ? area.value.trim() : '';
          if (!code) {
            toast('Please paste the timetable code first.');
            break;
          }
          try {
            const data = JSON.parse(code);
            if (Array.isArray(data.subjects) && Array.isArray(data.slots)) {
              state.subjects = data.subjects;
              state.slots = data.slots.map(s => ({
                id: uid(),
                day: s.day,
                time: s.time,
                subjectId: s.subjectId
              }));
              commit();
              $shareModal.style.display = 'none';
              triggerLuxuryPulse('safe', 'Timetable Imported! 🚀', 'Schedule ready to use.');
              toast('Timetable imported successfully!');
            } else {
              toast('Invalid timetable code.');
            }
          } catch (e) {
            toast('Invalid timetable code.');
          }
          break;
        }

        /* Subject Management */
        case 'add-sub': {
          const inp = document.getElementById('new-sub-name');
          const name = inp ? inp.value.trim() : '';
          if (!name) {
            toast('Please enter a subject name.');
            break;
          }
          state.subjects.push({ id: 's-' + uid(), name: name.slice(0, 60) });
          commit();
          toast('Subject added.');
          break;
        }

        case 'del-sub':
          arm('del-sub-' + d.id, () => {
            state.subjects = state.subjects.filter(s => s.id !== d.id);
            state.slots = state.slots.filter(x => x.subjectId !== d.id);
            for (const k in state.records) {
              if (state.records[k].subjectId === d.id) delete state.records[k];
            }
            commit();
            toast('Subject and related attendance deleted.');
          });
          break;

        /* Profile Editing */
        case 'edit-profile':
          onboardingStep = 1;
          renderOnboardingModal();
          break;

        case 'set-quick-thr':
          state.threshold = clampThr(parseFloat(d.val) * 10);
          commit();
          toast('Goal updated to ' + d.val + '%.');
          break;

        case 'show-demo':
          onboardingStep = 2;
          renderOnboardingModal();
          break;

        /* Backup & Restore */
        case 'copy-backup': {
          const area = document.getElementById('backup-code-area');
          if (area) {
            area.focus();
            area.select();
            try {
              navigator.clipboard.writeText(area.value).then(() => {
                toast('Backup code copied to clipboard!');
              }, () => {
                toast('Code selected. Press Ctrl+C or Copy.');
              });
            } catch (err) {
              toast('Code selected. Press Ctrl+C or Copy.');
            }
          }
          break;
        }

        case 'restore-backup': {
          const area = document.getElementById('restore-code-area');
          const code = area ? area.value.trim() : '';
          if (!code) {
            toast('Please paste your backup code first.');
            break;
          }
          try {
            state = normalize(JSON.parse(code), true);
            state.onboarded = true;
            commit();
            toast('Backup restored successfully!');
          } catch (e) {
            toast('Invalid Kamply backup code.');
          }
          break;
        }

        case 'erase-all':
          arm('erase-all', () => {
            state = baseState();
            state.onboarded = true;
            commit();
            toast('All attendance and timetable data cleared.');
          });
          break;

        /* Onboarding */
        case 'ob-save-profile': {
          const nameEl = document.getElementById('ob-name');
          const rollEl = document.getElementById('ob-roll');
          const yearEl = document.getElementById('ob-year');
          const semEl = document.getElementById('ob-sem');
          const secEl = document.getElementById('ob-section');

          state.profile.name = nameEl ? nameEl.value.trim() || 'Student' : 'Student';
          state.profile.roll = rollEl ? rollEl.value.trim() : '';
          state.profile.year = yearEl ? yearEl.value : '2nd Year';
          state.profile.sem = semEl ? semEl.value : 'Semester 3';
          state.profile.section = secEl ? secEl.value.trim() || 'Section A' : 'Section A';

          if (!state.slots.length) {
            let key = '2-3-A';
            if (state.profile.year === '1st Year') key = '1-1-A';
            else if (state.profile.year === '3rd Year') key = '3-5-A';
            loadOfficialPreset(key);
          }

          if (state.onboarded) {
            onboardingStep = 0;
            commit();
            toast('Profile updated successfully!');
          } else {
            onboardingStep = 2;
            renderOnboardingModal();
          }
          break;
        }

        case 'ob-close':
          onboardingStep = 0;
          render();
          break;

        case 'ob-finish':
          state.onboarded = true;
          onboardingStep = 0;
          commit();
          triggerLuxuryPulse('crimson', 'Welcome to Kamply! 🚀', 'Your attendance tracker is ready.');
          toast('Welcome to Kamply, ' + (state.profile.name.split(' ')[0] || 'friend') + '!');
          break;
      }
    });

    document.addEventListener('change', e => {
      const el = e.target;
      const act = el.dataset && el.dataset.act;
      if (!act) return;

      switch (act) {
        case 'date-pick':
          if (el.value) {
            viewDate = el.value;
            render();
          }
          break;

        case 'update-slot-time': {
          const slot = state.slots.find(s => s.id === el.dataset.id);
          if (slot) {
            slot.time = el.value;
            commit();
          }
          break;
        }

        case 'update-slot-sub': {
          const slot = state.slots.find(s => s.id === el.dataset.id);
          if (slot) {
            slot.subjectId = el.value;
            commit();
          }
          break;
        }

        case 'rename-sub': {
          const s = state.subjects.find(x => x.id === el.dataset.id);
          const val = el.value.trim();
          if (s && val) {
            s.name = val.slice(0, 60);
            commit();
          }
          break;
        }

        case 'update-threshold': {
          const v = parseFloat(el.value);
          if (isFinite(v)) {
            state.threshold = clampThr(v * 10);
            commit();
          }
          break;
        }
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && activeTab === 'today') {
        render();
      }
    });

    /* ==========================================================================
       12. INITIALIZATION & 2.5s SPLASH DISMISS
       ========================================================================== */
    state = loadState();
    saveState();
    render();

    // 2.5 second cinematic startup
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          splash.remove();
        }, 600);
      }
    }, 2500);

  })();
  </script>
</body>
</html>
