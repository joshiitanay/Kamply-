<div class="wrap"><header class="brand"><h1>Kamply</h1><div class="sub">B.Sc. (Hons) Chemistry · Ramjas College</div></header><nav class="tabs" aria-label="Sections"><button data-act="tab" data-v="today">Today</button><button data-act="tab" data-v="overview">Overview</button><button data-act="tab" data-v="timetable">Timetable</button><button data-act="tab" data-v="settings">Settings</button></nav><main id="app"></main></div><div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){'use strict';
function canSkip(a,t,P){return Math.floor((1000*a)/P)-t;}function needAttend(a,t,P){var n=P*t-1000*a;return n<=0?0:Math.ceil(n/(1000-P));}function pct10(a,t){return Math.floor((1000*a)/t);}
const KEY='kamply.v1';const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const DEFAULT_SUBJECTS=[['org-t','Organic Theory'],['inorg-t','Inorganic Theory'],['phys-t','Physical Theory'],['org-p','Organic Practical'],['inorg-p','Inorganic Practical'],['phys-p','Physical Practical'],['ge','GE'],['sec','SEC'],['vac','VAC'],['aec','AEC']];
const pad=n=>String(n).padStart(2,'0');const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const parseKey=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);};const todayKey=()=>keyOf(new Date());const fmtDate=k=>parseKey(k).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',year:'numeric'});const fmtTime=t=>{if(!t)return '';const p=t.split(':').map(Number);return ((p[0]+11)%12+1)+':'+pad(p[1])+' '+(p[0]>=12?'PM':'AM');};const uid=()=>Math.random().toString(36).slice(2,9);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isExtraKey=k=>k.split('|')[1].indexOf('extra-')===0;const bySlot=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99');const clampThr=v=>{v=Math.round(Number(v));return isFinite(v)?Math.min(999,Math.max(10,v)):667;};
function baseState(){return {v:1,threshold:667,sample:false,subjects:DEFAULT_SUBJECTS.map(s=>({id:s[0],name:s[1]})),slots:[],records:{}};}
function sampleState(){const s=baseState();s.sample=true;const tt={1:[['org-t','09:00'],['inorg-t','10:00'],['ge','11:00']],2:[['phys-t','09:00'],['org-t','10:00'],['sec','11:00']],3:[['inorg-p','10:00'],['phys-t','14:00']],4:[['org-p','10:00'],['vac','14:00']],5:[['inorg-t','09:00'],['phys-p','10:00'],['aec','14:00']],6:[['ge','09:00'],['phys-t','10:00'],['inorg-t','11:00']]};for(const d in tt)tt[d].forEach(x=>s.slots.push({id:uid(),day:+d,subjectId:x[0],time:x[1]}));let seed=20270101;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};const today=todayKey();for(let n=35;n>=1;n--){const date=addDays(today,-n),dow=parseKey(date).getDay();s.slots.filter(x=>x.day===dow).forEach(x=>{const r=rnd();s.records[date+'|'+x.id]={date:date,subjectId:x.subjectId,st:r<.72?'P':r<.9?'A':'C'};});}return s;}
function normalize(o,keepSample){if(!o||!Array.isArray(o.subjects)||!Array.isArray(o.slots)||!o.records||typeof o.records!=='object')throw new Error('bad');const subjects=o.subjects.filter(s=>s&&typeof s.id==='string'&&typeof s.name==='string').map(s=>({id:s.id,name:s.name.slice(0,60)}));const ids=new Set(subjects.map(s=>s.id));const slots=o.slots.filter(x=>x&&typeof x.id==='string'&&ids.has(x.subjectId)&&Number.isInteger(x.day)&&x.day>=0&&x.day<=6).map(x=>({id:x.id,day:x.day,subjectId:x.subjectId,time:/^\d{2}:\d{2}$/.test(x.time||'')?x.time:''}));const records={};for(const k in o.records){const r=o.records[k];if(r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&ids.has(r.subjectId)&&['P','A','C',null].indexOf(r.st)>-1&&/^\d{4}-\d{2}-\d{2}\|[\w-]+$/.test(k))records[k]={date:r.date,subjectId:r.subjectId,st:r.st};}return {v:1,threshold:clampThr(o.threshold),sample:!!(keepSample&&o.sample),subjects:subjects,slots:slots,records:records};}
let state,storageOk=true;function load(){let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){storageOk=false;return null;}if(!raw)return null;try{return normalize(JSON.parse(raw),true);}catch(e){return null;}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOk=false;}}
const thr=()=>(state.threshold/10).toFixed(1);function stats(){const m={};state.subjects.forEach(s=>{m[s.id]={a:0,t:0,c:0};});for(const k in state.records){const r=state.records[k],o=m[r.subjectId];if(!o)continue;if(r.st==='P'){o.a++;o.t++;}else if(r.st==='A'){o.t++;}else if(r.st==='C'){o.c++;}}return m;}const pctText=o=>o.t?(pct10(o.a,o.t)/10).toFixed(1)+'%':'–';function verdict(o){const P=state.threshold,plural=n=>n>1?'es':'';if(o.t===0)return {kind:'none',label:'No data',text:'No classes recorded yet.',short:'no classes yet'};if(1000*o.a>=P*o.t){const x=canSkip(o.a,o.t,P);if(x>0)return {kind:'safe',label:'Safe',text:'You can skip '+x+' more class'+plural(x)+' and stay at or above '+thr()+'%.',short:'can skip '+x};return {kind:'edge',label:'On the line',text:"Right on the line. Don't miss the next class.",short:'on the line'};}const y=needAttend(o.a,o.t,P);return {kind:'short',label:'Short',text:'Attend the next '+y+' class'+plural(y)+' in a row to reach '+thr()+'%.',short:'attend next '+y};}const subjectName=id=>{const s=state.subjects.find(x=>x.id===id);return s?s.name:'Removed subject';};
let view='today',viewDate=todayKey(),ttDay=1,armed=null,armTimer,toastTimer;const $app=document.getElementById('app');const sampleBanner=()=>state.sample?'<div class="banner"><span><strong>Sample data.</strong> The timetable and attendance below are made up so you can see how Kamply works.</span><button class="btn" data-act="clear-sample">Clear sample data</button></div>':'';
function renderToday(){const st=stats(),today=todayKey(),future=viewDate>today,dis=future?' disabled':'';const get=id=>st[id]||{a:0,t:0,c:0};const dow=parseKey(viewDate).getDay();const rows=state.slots.filter(x=>x.day===dow).sort(bySlot).map(x=>({key:viewDate+'|'+x.id,subjectId:x.subjectId,time:x.time,extra:false}));const slotCount=rows.length;for(const k in state.records){const r=state.records[k];if(r.date===viewDate&&isExtraKey(k))rows.push({key:k,subjectId:r.subjectId,time:'',extra:true});}const items=rows.map(r=>{const rec=state.records[r.key],cur=rec?rec.st:null,o=get(r.subjectId),v=verdict(o),nm=esc(subjectName(r.subjectId));const btn=(c,l)=>'<button data-act="mark" data-key="'+esc(r.key)+'" data-sub="'+esc(r.subjectId)+'" data-st="'+c+'" aria-pressed="'+(cur===c)+'"'+dis+'>'+l+'</button>';const meta=[r.extra?'Extra class':fmtTime(r.time),pctText(o),v.short].filter(Boolean).join(' · ');return '<li class="cls"><div class="cls-main"><div class="cls-name">'+nm+'</div><div class="cls-meta">'+meta+'</div></div><div class="seg" role="group" aria-label="Attendance for '+nm+'">'+btn('P','Present')+btn('A','Absent')+btn('C','Cancelled')+'</div>'+(r.extra?'<button class="btn" data-act="del-extra" data-key="'+esc(r.key)+'">Remove</button>':'')+'</li>';}).join('');let body;if(rows.length){body='<ul class="list">'+items+'</ul>';if(slotCount&&!future)body+='<button class="btn" data-act="all-present">Mark unmarked classes as present</button>';}else if(!state.slots.length){body='<div class="empty">Your weekly timetable is empty.<br><button class="btn primary" data-act="tab" data-v="timetable">Set up timetable</button></div>';}else{body='<div class="empty">No classes on '+DAYS[dow]+'.</div>';}const opts=state.subjects.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');const extra=future||!state.subjects.length?'':'<div class="extra"><label for="xsub">Extra or make-up class</label><div class="row"><select id="xsub">'+opts+'</select><button class="btn" data-act="add-extra">Add</button></div></div>';return sampleBanner()+'<div class="datebar"><button class="iconbtn" data-act="day" data-n="-1" aria-label="Previous day">‹</button><div class="date">'+fmtDate(viewDate)+'</div><button class="iconbtn" data-act="day" data-n="1" aria-label="Next day">›</button></div><div class="datebar"><input type="date" data-act="pick" value="'+viewDate+'" aria-label="Jump to a date"><button class="btn" data-act="today"'+(viewDate===today?' disabled':'')+'>Today</button></div>'+(future?'<p class="muted">This day has not happened yet. You can mark it once it has.</p>':'')+body+extra;}
function renderOverview(){const st=stats();let A=0,T=0,low=0;const cards=state.subjects.map(s=>{const o=st[s.id];A+=o.a;T+=o.t;const v=verdict(o);if(v.kind==='short')low++;const w=o.t?Math.min(100,100*o.a/o.t):0;return '<article class="card"><div class="card-head"><div><div class="card-name">'+esc(s.name)+'</div><span class="pill '+v.kind+'">'+v.label+'</span></div><div class="pct">'+pctText(o)+'</div></div><div class="scale" aria-hidden="true"><div class="fill '+v.kind+'" style="width:'+w+'%"></div><div class="tick" style="left:'+(state.threshold/10)+'%"><span>'+thr()+'%</span></div></div><p class="verdict">'+esc(v.text)+'</p><p class="counts">'+o.a+' attended of '+o.t+' held'+(o.c?' · '+o.c+' cancelled (not counted)':'')+'</p></article>';}).join('');const msg=T?(A+' of '+T+' classes attended. '+(low?low+' of '+state.subjects.length+' subject'+(low>1?'s are':' is')+' below '+thr()+'%.':'No subject is below '+thr()+'%.')):'Mark your first class to see numbers here.';return sampleBanner()+'<section class="card summary"><div><div class="label">Overall</div><div class="pct big">'+pctText({a:A,t:T})+'</div></div><p>'+msg+'</p></section>'+(cards?'<div class="grid">'+cards+'</div>':'<div class="empty">Add subjects in Settings.</div>');}
function renderTimetable(){const chips=[1,2,3,4,5,6].map(d=>'<button class="chip" data-act="ttday" data-d="'+d+'" aria-pressed="'+(ttDay===d)+'">'+DAYS[d].slice(0,3)+' <span class="n">'+state.slots.filter(x=>x.day===d).length+'</span></button>').join('');const opts=sel=>state.subjects.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+'</option>').join('');const slots=state.slots.filter(x=>x.day===ttDay).sort(bySlot);const list=slots.map(x=>'<li class="slot"><input type="time" value="'+x.time+'" data-act="slot-time" data-id="'+x.id+'" aria-label="Start time"><select data-act="slot-sub" data-id="'+x.id+'" aria-label="Subject">'+opts(x.subjectId)+'</select><button class="btn danger" data-act="slot-del" data-id="'+x.id+'">Remove</button></li>').join('');return sampleBanner()+'<h2>Weekly timetable</h2><p class="muted">Add every class that repeats each week. The Today page is built from this list.</p><div class="chips" role="group" aria-label="Day of the week">'+chips+'</div>'+(list?'<ul class="list">'+list+'</ul>':'<div class="empty">No classes on '+DAYS[ttDay]+' yet.</div>')+'<button class="btn primary" data-act="slot-add"'+(state.subjects.length?'':' disabled')+'>Add a class on '+DAYS[ttDay]+'</button>';}
function renderSettings(){const subs=state.subjects.map(s=>{const id='del-'+s.id,on=armed===id;return '<li class="slot"><input type="text" value="'+esc(s.name)+'" data-act="sub-name" data-id="'+esc(s.id)+'" aria-label="Subject name" maxlength="60" style="flex:1 1 180px;min-width:0"><button class="btn danger'+(on?' armed':'')+'" data-act="sub-del" data-id="'+esc(s.id)+'">'+(on?'Tap again to confirm':'Delete')+'</button></li>';}).join('');const eraseOn=armed==='erase';const backup=JSON.stringify({v:1,threshold:state.threshold,subjects:state.subjects,slots:state.slots,records:state.records});return (storageOk?'':'<div class="banner"><span>This browser is not saving data right now. Copy your backup code below before you leave.</span></div>')+sampleBanner()+'<h2>Settings</h2><section class="card"><div class="field"><label for="thr">Required attendance (%)</label><input id="thr" type="number" inputmode="decimal" min="1" max="99.9" step="0.1" value="'+thr()+'" data-act="set-thr"></div><p class="muted" style="margin:0">Percentages are rounded down, so a 66.6% never shows as 66.7%.</p></section><section class="sec"><h3>Subjects</h3><ul class="list">'+subs+'</ul><div class="setrow"><input id="newsub" type="text" placeholder="New subject name" maxlength="60" aria-label="New subject name"><button class="btn" data-act="sub-add">Add subject</button></div><p class="muted">Deleting a subject also removes its classes and attendance.</p></section><section class="sec"><h3>Backup and move to another device</h3><p class="muted">Your data is saved only in this browser. Copy the code, keep it somewhere safe, and paste it into Kamply on another device to restore.</p><textarea id="backup" readonly aria-label="Backup code">'+esc(backup)+'</textarea><div class="setrow" style="margin-top:8px"><button class="btn primary" data-act="copy-backup">Copy backup code</button></div><div class="field" style="margin-top:14px"><label for="restore">Restore from a backup code</label><textarea id="restore" placeholder="Paste a backup code here"></textarea></div><button class="btn" data-act="restore">Restore</button></section><section class="sec"><h3>Erase everything</h3><p class="muted">Removes your timetable, attendance and subject changes from this browser.</p><button class="btn danger'+(eraseOn?' armed':'')+'" data-act="erase">'+(eraseOn?'Tap again to erase':'Erase all my data')+'</button></section>';}
function focusSig(){const el=document.activeElement;if(!el||!el.dataset||!el.dataset.act||!$app.contains(el))return null;return Object.assign({},el.dataset);}function restoreFocus(sig){if(!sig)return;const els=$app.querySelectorAll('[data-act]');for(const el of els){const d=el.dataset,ks=Object.keys(sig);if(Object.keys(d).length===ks.length&&ks.every(k=>d[k]===sig[k])){el.focus({preventScroll:true});return;}}}function render(){const sig=focusSig();document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));const fn={today:renderToday,overview:renderOverview,timetable:renderTimetable,settings:renderSettings}[view];$app.innerHTML=fn();restoreFocus(sig);}function commit(){save();render();}function toast(m){const t=document.getElementById('toast');t.innerHTML='<span class="toast-msg"></span>';t.firstChild.textContent=m;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.innerHTML='';},3200);}function arm(id,fn){if(armed===id){armed=null;clearTimeout(armTimer);fn();return;}armed=id;render();clearTimeout(armTimer);armTimer=setTimeout(()=>{if(armed===id){armed=null;render();}},3500);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||b.tagName==='INPUT'||b.tagName==='SELECT')return;const a=b.dataset.act,d=b.dataset;switch(a){case 'tab':view=d.v;armed=null;render();break;case 'day':viewDate=addDays(viewDate,+d.n);render();break;case 'today':viewDate=todayKey();render();break;case 'mark':{const cur=state.records[d.key];if(cur&&cur.st===d.st){if(isExtraKey(d.key))cur.st=null;else delete state.records[d.key];}else state.records[d.key]={date:viewDate,subjectId:d.sub,st:d.st};commit();break;}case 'all-present':{const dow=parseKey(viewDate).getDay();state.slots.filter(x=>x.day===dow).forEach(x=>{const k=viewDate+'|'+x.id;if(!state.records[k]||!state.records[k].st)state.records[k]={date:viewDate,subjectId:x.subjectId,st:'P'};});commit();break;}case 'add-extra':{const sel=document.getElementById('xsub');if(!sel||!sel.value)break;state.records[viewDate+'|extra-'+uid()]={date:viewDate,subjectId:sel.value,st:null};commit();break;}case 'del-extra':delete state.records[d.key];commit();break;case 'ttday':ttDay=+d.d;render();break;case 'slot-add':state.slots.push({id:uid(),day:ttDay,subjectId:state.subjects[0].id,time:''});commit();break;case 'slot-del':state.slots=state.slots.filter(x=>x.id!==d.id);commit();break;case 'sub-add':{const inp=document.getElementById('newsub'),name=inp.value.trim();if(!name){toast('Type a subject name first.');break;}state.subjects.push({id:'s-'+uid(),name:name.slice(0,60)});commit();break;}case 'sub-del':arm('del-'+d.id,()=>{state.subjects=state.subjects.filter(s=>s.id!==d.id);state.slots=state.slots.filter(x=>x.subjectId!==d.id);for(const k in state.records)if(state.records[k].subjectId===d.id)delete state.records[k];commit();});break;case 'clear-sample':state.sample=false;state.records={};state.slots=[];commit();toast('Sample data cleared. Add your own timetable to begin.');break;case 'copy-backup':{const t=document.getElementById('backup');const fallback=()=>{t.focus();t.select();toast('Select the code and copy it (Ctrl+C, or long-press then Copy).');};try{navigator.clipboard.writeText(t.value).then(()=>toast('Backup code copied.'),fallback);}catch(err){fallback();}break;}case 'restore':{const v=document.getElementById('restore').value.trim();try{state=normalize(JSON.parse(v),false);save();render();toast('Backup restored.');}catch(err){toast('That is not a valid Kamply backup code.');}break;}case 'erase':arm('erase',()=>{state=baseState();commit();toast('All data erased.');});break;}});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;if(a==='pick'){if(el.value){viewDate=el.value;render();}return;}if(a==='slot-time'||a==='slot-sub'){const x=state.slots.find(s=>s.id===el.dataset.id);if(!x)return;if(a==='slot-time')x.time=el.value;else x.subjectId=el.value;commit();return;}if(a==='sub-name'){const s=state.subjects.find(x=>x.id===el.dataset.id),n=el.value.trim();if(s&&n)s.name=n.slice(0,60);commit();return;}if(a==='set-thr'){const v=parseFloat(el.value);if(isFinite(v))state.threshold=clampThr(v*10);commit();return;}});
state=load()||sampleState();save();render();})();
</script>
</body></html>
